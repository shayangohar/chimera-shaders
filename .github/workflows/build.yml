name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # the open-source cache provider, not the proprietary default
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # fixture tests, metrics and the jar; the pack corpus and GPU checks run locally
      - run: ./gradlew build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
