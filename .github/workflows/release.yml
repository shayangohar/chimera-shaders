name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # added to every release title; empty it when Chimera leaves beta
  STAGE: Beta

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # the tag names the version, so it must match the one the jar is built with
      - name: Check the tag against mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: ./gradlew build
      # a tag with a suffix, such as v0.2.0-beta.1, is published as a pre-release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "build/libs/chimera-$VERSION.jar" \
            --title "Chimera $VERSION${STAGE:+ $STAGE}" --generate-notes --verify-tag $prerelease
