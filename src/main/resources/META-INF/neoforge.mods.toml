modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "chimera"
version = "${version}"
displayName = "Chimera"
description = "Shaderpack pipeline for VulkanMod - Iris-class shaders on Vulkan."
authors = "shayangohar"
# light lettering for the mods list's dark panel
logoFile = "chimera_logo.png"

[[mixins]]
config = "chimera.mixins.json"

[[dependencies.chimera]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.chimera]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

# VulkanMod Reforged, the host renderer; loads first since Chimera mixes into it
# pinned to the one build Chimera's mixins target; any other build gets NeoForge's dependency screen
# instead of a crash at launch
[[dependencies.chimera]]
modId = "vulkanmod"
type = "required"
versionRange = "[0.3.5-ALPHA+1.21.1]"
ordering = "AFTER"
side = "CLIENT"
