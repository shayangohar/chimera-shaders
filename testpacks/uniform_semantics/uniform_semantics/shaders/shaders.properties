uniform.float.customMarker = customFactor + rainStrength
variable.float.customFactor = frameTimeCounter > 0.0 ? 2.0 : 1.0
variable.float.customCycleA = customCycleB + 1.0
variable.float.customCycleB = customCycleA + 1.0
variable.float.customUnknown = missingCustomValue + 1.0

# The pack-authored language, written the way the pinned packs write it: a smoothing call with its
# half lives, a named biome constant, a component of an engine input, a math call, and a
# declaration that continues onto the next line.
uniform.float.customDerived = smooth(7, rainStrength, 5, 5) + if(in(biome, BIOME_DESERT), 1, 0) + \
                              sqrt(9.0) + customContinued
uniform.float.customComponent = eyeBrightness.y + cameraPosition.y
variable.float.customContinued = max(2.0, frameTimeCounter) + 1.0

# A value that cannot be finite: the session must name it and hold a finite result, never
# substitute an invented number.
uniform.float.customNonFinite = sqrt(0.0 - 1.0)

# Each of these is refused, and the deviation names what was wrong rather than serving a zero.
uniform.float.customBadFunction = sinh(frameTime)
uniform.float.customBadArity = smooth(rainStrength, 1, 2, 3)
uniform.float.customBadComponent = frameTime.x
uniform.float.customBadConstant = BIOME_NOT_A_BIOME + 1.0
